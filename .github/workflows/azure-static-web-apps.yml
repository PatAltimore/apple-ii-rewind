name: Azure Static Web Apps CI/CD

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize, reopened, closed]
        branches: [main]

jobs:
    build_and_deploy_job:
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
        runs-on: ubuntu-latest
        name: Build and Deploy Job
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - name: Fetch Total Replay disk image
              # Not committed to the repo; see README "Getting the disk image".
              run: node web/scripts/fetch-total-replay.mjs
            - name: Fetch Applesoft disk programs
              # Classic BASIC programs for ?boot=basic mode; fetched from
              # archive.org, not committed. See README "Getting the disk image".
              run: node web/scripts/fetch-basic-programs.mjs
            - name: Build And Deploy
              id: builddeploy
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  action: "upload"
                  app_location: "web"
                  output_location: "dist"
                  api_location: ""
                  skip_app_build: false
                  app_build_command: "npm install && npm run build"

    close_pull_request_job:
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        runs-on: ubuntu-latest
        name: Close Pull Request Job
        steps:
            - name: Close Pull Request
              id: closepullrequest
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
                  action: "close"
