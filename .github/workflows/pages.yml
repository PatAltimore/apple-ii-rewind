name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - name: Cache disk images
              # The fetch scripts skip files that are already present and
              # checksum-valid, so archive.org is only hit on a cache miss.
              uses: actions/cache@v4
              with:
                  path: web/public/disks
                  key: disks-${{ hashFiles('web/scripts/fetch-total-replay.mjs', 'web/scripts/fetch-basic-programs.mjs') }}
            - name: Fetch Total Replay disk image
              # Not committed to the repo; see README "Getting the disk image".
              run: node web/scripts/fetch-total-replay.mjs
            - name: Fetch Applesoft disk programs
              run: node web/scripts/fetch-basic-programs.mjs
            - name: Build
              working-directory: web
              run: npm install && npm run build
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: web/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
